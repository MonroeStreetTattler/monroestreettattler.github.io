<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Monroe Street Tattler Dog Water Bowl & Treat Map</title>
<meta name="description" content="A neighbor-submitted map of dog water bowls and treat spots around Monroe Street.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --paper: #fdfcf3; --ink: #111; --red: #b3241c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e4e2d8; color: var(--ink); font-family: Georgia, 'Times New Roman', serif; line-height: 1.55; }
  .wrap { max-width: 900px; margin: 0 auto; background: var(--paper); min-height: 100vh; padding: 0 26px 50px; box-shadow: 0 0 40px rgba(0,0,0,0.15); }

  nav.tabs {
    display: flex; justify-content: center; gap: 22px; font-family: Arial, sans-serif;
    font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    padding: 12px 0 26px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); margin-bottom: 20px;
  }
  nav.tabs a { color: var(--ink); text-decoration: none; }
  nav.tabs a:hover, nav.tabs a.active { color: var(--red); border-bottom: 2px solid var(--red); }

  h1.masthead {
    font-family: 'Times New Roman', Times, serif; font-weight: 900; text-align: center;
    text-transform: uppercase; letter-spacing: 0.5px;
    font-size: clamp(22px, 5.5vw, 36px); margin: 10px 0 6px;
  }
  .subhead {
    text-align: center; font-style: italic; font-size: 13px; margin: 0 0 24px;
  }

  #map { height: 480px; width: 100%; border: 2px solid var(--ink); margin-bottom: 20px; }

  .legend {
    display: flex; justify-content: center; gap: 30px; font-family: Arial, sans-serif;
    font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 26px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.water { background: #2a6fb0; }
  .dot.treats { background: #b3241c; }
  .dot.both { background: #5a8a3a; }

  .box {
    border: 1.5px solid var(--ink); padding: 16px 18px; font-size: 14px; margin-bottom: 20px;
  }
  .box a { color: var(--red); font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">

  <nav class="tabs">
    <a href="index.html">Home</a>
    <a href="faq.html">FAQ</a>
    <a href="dog-map.html" class="active">Dog Map</a>
    <a href="index.html#contribute">Contribute</a>
  </nav>

  <h1 class="masthead">Official Dog Water Bowl & Treat Map</h1>
  <p class="subhead">A neighbor-submitted map of every known water bowl and treat jar around the broader neighborhood</p>

  <div class="legend">
    <span>💧 Water</span>
    <span>🦴 Treats</span>
    <span>💧🦴 Both</span>
  </div>

  <div id="map"></div>

  <div class="box">
    Know a spot we're missing? <a href="#" onclick="openDogFormModal(event)" id="dog-map-form-link">Report a Dog Water Bowl or Treat Spot</a> and it'll be added to the map.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([43.0570, -89.4275], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const colors = { water: '#2a6fb0', treats: '#b3241c', both: '#5a8a3a' };

  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDycSySJ29-mgW64bue-2NVj5Q7Sbvj9MZNAwOYzNDgvfs_4qdoUQllcIGabXB0GDrQZnJe3gWQaGd/pub?output=csv';

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], next = text[i+1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (field.length || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
          if (c === '\r' && next === '\n') i++;
        } else { field += c; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToObjects(rows) {
    const headers = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1).filter(r => r.some(v => v && v.trim())).map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
  }

  function findKey(obj, ...guesses) {
    const keys = Object.keys(obj);
    for (const g of guesses) {
      const hit = keys.find(k => k.includes(g));
      if (hit) return hit;
    }
    return null;
  }

  async function geocode(address) {
    const cacheKey = 'geocode:' + address;
    const cached = localStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);

    const query = encodeURIComponent(address + ', Madison, WI');
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + query;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data && data[0]) {
        const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        localStorage.setItem(cacheKey, JSON.stringify(coords));
        return coords;
      }
    } catch (e) {
      console.error('Geocoding failed for', address, e);
    }
    return null;
  }

  function addMarker(spot) {
    let iconHtml;
    if (spot.type === 'both') {
      iconHtml = '<div style="font-size:20px; line-height:1; text-shadow: 0 0 3px #fdfcf3, 0 0 3px #fdfcf3;">💧🦴</div>';
    } else if (spot.type === 'treats') {
      iconHtml = '<div style="font-size:24px; line-height:1; text-shadow: 0 0 3px #fdfcf3, 0 0 3px #fdfcf3;">🦴</div>';
    } else {
      iconHtml = '<div style="font-size:24px; line-height:1; text-shadow: 0 0 3px #fdfcf3, 0 0 3px #fdfcf3;">💧</div>';
    }
    const icon = L.divIcon({ html: iconHtml, className: 'dog-map-icon', iconSize: [30, 30], iconAnchor: [15, 15] });
    const marker = L.marker([spot.lat, spot.lng], { icon: icon }).addTo(map);
    const typeLabel = spot.type === 'both' ? 'Water & Treats' : (spot.type.charAt(0).toUpperCase() + spot.type.slice(1));
    marker.bindPopup(
      '<strong>' + spot.name + '</strong><br>' +
      typeLabel + '<br>' +
      (spot.location ? spot.location + '<br>' : '') +
      (spot.notes ? '<em>' + spot.notes + '</em>' : '')
    );
  }

  async function loadLiveSpots() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 2) return;
      const entries = rowsToObjects(rows);

      for (const entry of entries) {
        const nameKey = findKey(entry, 'spot name', 'name');
        const typeKey = findKey(entry, 'type');
        const locKey = findKey(entry, 'location', 'address');
        const notesKey = findKey(entry, 'notes');

        const name = nameKey ? entry[nameKey] : 'Unnamed spot';
        const rawType = typeKey ? entry[typeKey].toLowerCase() : 'water';
        const type = rawType.includes('both') ? 'both' : (rawType.includes('treat') || rawType.includes('food')) ? 'treats' : 'water';
        const location = locKey ? entry[locKey] : '';
        const notes = notesKey ? entry[notesKey] : '';

        if (!location) continue;
        const coords = await geocode(location);
        if (coords) {
          addMarker({ name, type, location, notes, lat: coords.lat, lng: coords.lng });
        }
        await new Promise(r => setTimeout(r, 1000)); // be polite to the free geocoding service
      }
    } catch (err) {
      console.error('Could not load live spots from Sheet:', err);
    }
  }

  loadLiveSpots();
</script>
<script src="dog-form-modal.js"></script>
</body>
</html>
